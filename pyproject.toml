[project]
name = "company-policy-answer-agent"
version = "0.1.0"
description = "Sourced policy Q&A with LangChain and Anthropic"
requires-python = ">=3.12"
dependencies = ["langchain>=1.0,<2", "langchain-anthropic==1.7.6"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
policy-answer = "policy_answer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_answer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
